name: Trigger build in seasonder-rest

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar a seasonder-rest
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.PAT_SEASONDER_REST }}" \
          https://api.github.com/repos/GOFUVI/seasonder-rest/dispatches \
          -d '{"event_type": "build"}'
